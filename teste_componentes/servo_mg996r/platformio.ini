; Teste de componente — Servo TowerPro 180 graus (MG995 / MG996R) em ESP32-WROOM-32
;
;   pio run                      compila
;   pio run -t upload            grava na placa
;   pio device monitor -b 115200 abre o monitor serial
;
; Se o build reclamar de versao da plataforma, fixar:
;   platform = espressif32@^6.9.0

[env:esp32dev]
platform      = espressif32
board         = esp32dev          ; generico, cobre a ESP32-WROOM-32
framework     = arduino
monitor_speed = 115200

; A placa aparece como "Silicon Labs CP210x" (VID:PID 10C4:EA60) - e o conversor
; USB-serial da dev board, nao o ESP32 em si. Normal.
; Fixado porque o Windows expoe varias COM virtuais de Bluetooth que confundem a
; autodeteccao. Se a porta mudar de PC, ajuste aqui ou use: pio run -t upload --upload-port COMx
upload_port   = COM6
monitor_port  = COM6

lib_deps =
    madhephaestus/ESP32Servo

build_flags =
    -D MONITOR_SPEED=115200
