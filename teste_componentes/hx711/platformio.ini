; Teste de componente - modulo XFW-HX711 + 4 celulas de carga de meia-ponte
;
;   pio run                      compila
;   pio run -t upload            grava na placa
;   pio device monitor           abre o monitor serial
;
; ATENCAO: o modulo vai em 3,3 V, nunca em 5 V. O nivel logico do DT acompanha
; o VCC, e 5 V num GPIO da ESP32 e o problema E1 do docs/02.

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200

; O Windows expoe varias COM virtuais de Bluetooth que confundem a autodeteccao.
upload_port   = COM6
monitor_port  = COM6

lib_deps =
    bogde/HX711

build_flags =
    -D MONITOR_SPEED=115200
