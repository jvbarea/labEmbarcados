; Firmware de teste - Alimentador: BLE + servo posicional + balanca mockada
;
;   pio run -t upload
;   pio device monitor
;
; Wi-Fi e HTTP ficam de fora nesta fase (ver REVISAO.md secao "Escopo").

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_port   = COM6
monitor_port  = COM6

; O stack BLE sozinho ja ocupa ~89% da particao padrao de 1,3 MB. Com huge_app
; a aplicacao ganha ~3 MB, deixando espaco para o Wi-Fi da fase 2.
; (doc 07 secao 5 antecipava esse aperto)
board_build.partitions = huge_app.csv

lib_deps =
    madhephaestus/ESP32Servo
    bogde/HX711
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -D MONITOR_SPEED=115200
