; Firmware do Alimentador: BLE (protocolo Feed Cat v2) + servo posicional + balanca
;
;   pio run -t upload            balanca REAL (HX711), o padrao
;   pio run -e mock -t upload    balanca SIMULADA ('w <gramas>' no serial)
;   pio device monitor
;
; Wi-Fi e HTTP ficam de fora nesta fase (ver REVISAO.md secao "Escopo").

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform      = espressif32
board         = esp32dev
framework     = arduino
monitor_speed = 115200
upload_port   = COM6
monitor_port  = COM6

; O stack BLE sozinho ja ocupa ~89% da particao padrao de 1,3 MB. Com huge_app
; a aplicacao ganha ~3 MB, deixando espaco para o Wi-Fi da fase 2.
; (doc 07 secao 5 antecipava esse aperto)
; A mesma tabela tem uma particao de dados de ~900 KB: e ali que o LittleFS
; guarda o historico de eventos (EventLog.cpp).
board_build.partitions = huge_app.csv
board_build.filesystem = littlefs

lib_deps =
    madhephaestus/ESP32Servo
    bogde/HX711
    bblanchon/ArduinoJson@^7.0.0

build_flags =
    -D MONITOR_SPEED=115200

; Mesmo firmware com a balanca simulada: para testar a maquina de estados e o
; app sem celula de carga. A configuracao e o historico na flash sao os mesmos,
; entao trocar de um para o outro nao apaga os gatos cadastrados.
[env:mock]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D USE_HX711=0
